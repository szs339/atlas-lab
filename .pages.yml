        label: Short biography
        type: text
      - name: startDate
        label: Joined
        type: string
        description: YYYY-MM-DD; leave blank when unknown.
      - name: endDate
        label: Left
        type: string
        description: YYYY-MM-DD; leave blank when unknown.
      - name: position
        label: Current position
        type: string
      - name: positionVerified
        label: Position last verified
        type: string
        description: YYYY-MM-DD; leave blank when unknown.
      - name: photo
        label: Photograph
