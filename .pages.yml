  - name: people
    label: People
    type: collection
    path: content/people
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    exclude:
      - .gitkeep
    subfolders: false
    view:
      primary: name
      fields:
        - name
        - published
    fields:
      - name: id
        label: Permanent ID
        type: string
        required: true
        description: "Set once: lowercase letters, numbers and hyphens. Keep this ID when editing names or titles. Filename must match ID."
      - name: published
        label: Publish on website
        type: boolean
        default: false
        description: Off hides this record from the website. Repository files remain public.
      - name: name
        label: Full name
        type: string
        required: true
      - name: role
        label: Role / title
        type: string
        required: true
      - name: category
        label: Category
