        label: Director
        type: reference
        required: true
        options:
          collection: people
          multiple: false
          value: "{fields.id}"
          label: "{fields.name}"
          search: name,id
      - name: cvPath
        label: Public CV (PDF)
        type: file
      - name: heroImage
        label: Homepage background image
        type: image
        description: Decorative image without text. A wide, dark image works best. Leave blank for a plain background.
